name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Ref of workshop-nexus-intro-code to build against (branch, tag, or sha)"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/temporalio/workshop-nexus-intro-sandbox
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout workshop-nexus-intro-code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: temporalio/workshop-nexus-intro-code
          path: workshop-nexus-intro-code
          ref: ${{ github.event.inputs.code_ref || 'main' }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "extra=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra=${IMAGE}:${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.extra }}
            ${{ env.IMAGE }}:${{ github.sha }}
